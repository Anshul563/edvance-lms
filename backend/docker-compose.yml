services:
  redis:
    image: redis:7-alpine
    container_name: edvance-redis
    restart: unless-stopped
    ports:
      - "127.0.0.1:6379:6379"
    volumes:
      - redis-data:/data
    command: ["redis-server", "--appendonly", "yes", "--maxmemory", "256mb", "--maxmemory-policy", "allkeys-lru"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5
      start_period: 5s

  api:
    build:
      context: ./api
      dockerfile: Dockerfile
      target: runtime
    container_name: edvance-api
    restart: unless-stopped
    depends_on:
      redis:
        condition: service_healthy
    ports:
      - "4000:4000"
    environment:
      NODE_ENV: development
      PORT: "4000"
      LOG_LEVEL: debug
      CORS_ORIGIN: http://localhost:5173
      REDIS_URL: redis://redis:6379
      DATABASE_URL: ${DATABASE_URL}
      JWT_ACCESS_SECRET: ${JWT_ACCESS_SECRET}
      JWT_REFRESH_SECRET: ${JWT_REFRESH_SECRET}
      VIDEO_ENGINE_URL: http://video-engine:8080
    volumes:
      - ./api/src:/app/src
      - /app/node_modules

  video-engine:
    build:
      context: ./video-engine
      dockerfile: Dockerfile
    container_name: edvance-video-engine
    restart: unless-stopped
    ports:
      - "8080:8080"
    environment:
      PORT: "8080"
    volumes:
      - ./video-engine/uploads:/app/uploads

volumes:
  redis-data:
